<div class="elevated-form">
  <h3>Two-factor authentication</h3>
  <div>
    <mat-form-field>
      <mat-label>One-time password code</mat-label>
      <input
        matInput
        [formControl]="totpControl"
        mask="000 000"
        type="tel"
        placeholder="123 456"
        autocomplete="one-time-code"
      />
    </mat-form-field>
  </div>
</div>
