<div [formGroup]="profileForm" class="elevated-form">
  <h3>Profile</h3>
  <div>
    <mat-form-field>
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" type="text" readonly />
    </mat-form-field>
  </div>
  <div>
    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="text" readonly />
    </mat-form-field>
  </div>
  <div>
    <mat-form-field>
      <mat-label>Roles</mat-label>
      <input matInput formControlName="roles" type="text" readonly />
    </mat-form-field>
  </div>
</div>
