<div class="media-item__snapshot">
  @if (item) {
    @let snapshot = item.snapshot();
    @if (item.isVideo) {
      <span class="media-item__snapshot-duration">{{ item.videoLength }}</span>
    }
    @if (!snapshot) {
      <div class="media-item__snapshot-placeholder media-item__snapshot-content">
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
      </div>
    } @else {
      <img
        [src]="snapshot"
        (click)="itemTouched()"
        alt="snapshot"
        class="media-item__snapshot-content"
      />
    }
    @if (selectMode()) {
      <button
        matIconButton
        class="media-item__snapshot-button-select"
        type="button"
        (click)="item.toggleSelected(); $event.stopPropagation()"
      >
        <span class="material-icons-outlined">
          {{ item.isSelected() ? 'check_box' : 'check_box_outline_blank' }}
        </span>
      </button>
      <button
        matIconButton
        class="media-item__snapshot-button-open"
        type="button"
        (click)="openItem(); $event.stopPropagation()"
      >
        <span class="material-icons-outlined"> open_in_full </span>
      </button>
    }
    @if (item.isSelected()) {
      <div class="media-item__snapshot-highlight theme-color-border"></div>
    }
  }
</div>
