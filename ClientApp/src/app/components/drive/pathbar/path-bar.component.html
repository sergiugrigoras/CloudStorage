<div class="path-bar">
  @for (node of path; track $index) {
    <div class="path-bar-elem">
      <div class="path-bar-folder" (click)="openFolder(node.id)">
        {{ node.name }}
      </div>
      <div class="path-bar-icon">
        <span class="material-icons"> chevron_right </span>
      </div>
    </div>
  }
</div>
