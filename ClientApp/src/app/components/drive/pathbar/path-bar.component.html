<div class="path-bar">
  @for (fso of fullPathArr; track fso.id) {
    <div class="path-bar-elem">
      <div class="path-bar-folder" (click)="openFolder(fso.id)">
        {{ fso.name }}
      </div>
      <div class="path-bar-icon">
        <span class="material-icons"> chevron_right </span>
      </div>
    </div>
  }
</div>
